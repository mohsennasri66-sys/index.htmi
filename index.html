<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مهندسی محسن نصری | تجهیزات صنعتی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #0b131e; color: #ffffff; direction: rtl; text-align: right; }
        
        /* استایل بنر صنعتی بالای سایت */
        .banner-container {
            width: 100%;
            height: 350px;
            background-image: url('banner.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        /* یک لایه تیره روی عکس می‌گذارد تا نوشته‌ها یا خطوط بهتر دیده شوند */
        .banner-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        header { background-color: #070b12; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e67e22; }
        .hero { background: #0f172a; padding: 30px 5%; text-align: center; border-bottom: 3px solid #e67e22; }
        .hero h2 { font-size: 2rem; color: #e67e22; margin-bottom: 10px; }
        
        .projects { padding: 30px 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 8px; overflow: hidden; text-align: center; }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card h4 { padding: 15px; color: #fff; }
        .contact { padding: 40px; text-align: center; background: #070b12; }
        .btn { background: #e67e22; color: #fff; padding: 12px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

    <!-- هدر سایت -->
    <header>
        <h1>مهندسی محسن نصری</h1>
        <a href="tel:09193890454" style="color:#e67e22; font-weight:bold; text-decoration:none;">۰۹۱۹۳۸۹۰۴۵۴</a>
    </header>

    <!-- عکس صنعتی پشت زمینه بالای سایت -->
    <div class="banner-container"></div>

    <section class="hero">
        <h2>مرجع تخصصی نصب و تعمیرات تجهیزات صنعتی</h2>
        <p>بیش از دو دهه تجربه در صنایع سنگین</p>
    </section>

    <!-- ۵ بخش تخصصی پایین -->
    <section class="projects">
        <div class="card"><img src="sim.jpg"><h4 style="margin-top:-5px">سیم‌پیچی</h4></div>
        <div class="card"><img src="float.jpg"><h4 style="margin-top:-5px">شیشه فلوت</h4></div>
        <div class="card"><img src="cable.jpg"><h4 style="margin-top:-5px">صنعت کابل</h4></div>
        <div class="card"><img src="steel.jpg"><h4 style="margin-top:-5px">صنعت فولاد</h4></div>
        <div class="card"><img src="bottle.jpg"><h4 style="margin-top:-5px">شیشه دارویی</h4></div>
    </section>

    <section class="contact">
        <a href="tel:09193890454" class="btn">تماس با من: ۰۹۱۹۳۸۹۰۴۵۴</a>
    </section>

</body>
</html>
